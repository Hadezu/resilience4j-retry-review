name: Java retry proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify unmodified upstream baseline
        run: |
          git worktree add --detach ../upstream 7e3ab5252ed380b596e25240f19376a4435570b8
          cd ../upstream
          bash gradlew :resilience4j-core:test :resilience4j-retry:test :resilience4j-retry:assemble --no-daemon --console=plain
          mkdir -p "$GITHUB_WORKSPACE/proof-evidence/baseline"
          cp -r resilience4j-core/build/test-results/test "$GITHUB_WORKSPACE/proof-evidence/baseline/core"
          cp -r resilience4j-retry/build/test-results/test "$GITHUB_WORKSPACE/proof-evidence/baseline/retry"
      - name: Prove regressions fail on upstream
        shell: bash
        run: |
          test_path=resilience4j-retry/src/test/java/io/github/resilience4j/retry/internal/ScheduledSupplierFailureTest.java
          cp "$test_path" "../upstream/$test_path"
          cd ../upstream
          set +e
          bash gradlew :resilience4j-retry:test --tests '*ScheduledSupplierFailureTest' --no-daemon --console=plain
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'resilience4j-retry/build/test-results/test/TEST-io.github.resilience4j.retry.internal.ScheduledSupplierFailureTest.xml'
          root = ET.parse(p).getroot()
          expected = {
              'scheduledSupplierExceptionMustCompleteOriginalFuture()',
              'resultBasedRetryMustAlsoCompleteOnSynchronousFailure()',
              'scheduledErrorMustCompleteOriginalFutureWithoutRetry()'
          }
          actual = {case.attrib['name'] for case in root.findall('testcase') if case.find('failure') is not None}
          # Upstream's test-retry plugin repeats failed tests. Count distinct
          # cases, while still rejecting any unexpected failure or skip.
          cases = root.findall('testcase')
          assert len({case.attrib['name'] for case in cases}) == 7, root.attrib
          assert root.attrib['skipped'] == '0' and root.attrib['errors'] == '0', root.attrib
          assert actual == expected, actual
          assert all('the caller must not remain pending' in case.find('failure').attrib.get('message', '')
                     for case in root.findall('testcase') if case.find('failure') is not None)
          print('Confirmed three pending-future regressions; four controls pass on upstream.')
          PY
      - name: Verify patched core and retry modules
        run: bash gradlew :resilience4j-core:test :resilience4j-retry:test :resilience4j-retry:assemble --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-proof-test-results
          path: |
            resilience4j-core/build/test-results/test/
            resilience4j-retry/build/test-results/test/
            proof-evidence/
          retention-days: 14
